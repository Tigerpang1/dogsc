name: Windows CI

on:
  push:
    branches:
      - codex/windows
  pull_request:
    branches:
      - codex/windows
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and pure logic checks
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Prepare verified native media
        shell: pwsh
        run: ./scripts/ensure-native-media.ps1

      - name: Build the Windows app
        run: dotnet build src/FrameTrail.App/FrameTrail.App.csproj --configuration Release -p:RestoreLockedMode=true

      - name: Run core, capture logic, and release policy checks
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release -IncludeCaptureProbe -IncludeReleaseProbe
